name: Validate PARTISOLFA

on:
  push:
    branches:
      - feature/identidade-visual-verde-marinho
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

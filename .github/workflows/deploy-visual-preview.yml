name: Deploy PARTISOLFA visual preview

on:
  push:
    branches:
      - feature/identidade-visual-verde-marinho
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: partisolfa-visual-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove repository environment files
        run: rm -f .env .env.*
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build isolated visual preview (no production backend)
        run: npm run build -- --mode github-pages-preview
        env:
          VITE_SUPABASE_URL: https://preview.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: preview-only-no-backend
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
